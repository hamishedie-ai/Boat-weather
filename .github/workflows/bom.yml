name: Update BOM forecasts

on:
  schedule:
    - cron: "23 * * * *"   # every hour
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download BOM marine forecasts
        run: |
          python3 - <<'EOF'
          import json, os, ftplib, io, datetime, re
          import xml.etree.ElementTree as ET
          PRODUCTS = {
              "IDT12420": "Derwent Estuary",
              "IDT12430": "D'Entrecasteaux Channel",
              "IDT12450": "Frederick Henry & Norfolk Bays",
              "IDT12326": "South East Coast",
          }
          out = {"updated": datetime.datetime.now(datetime.timezone.utc).isoformat(), "products": {}}
          ftp = ftplib.FTP("ftp.bom.gov.au", timeout=60)
          ftp.login()
          ftp.cwd("/anon/gen/fwo")
          names = ftp.nlst()
          print("Matching files:", [n for n in names if n.startswith(("IDT124", "IDT123"))])

          def xml_to_text(raw):
              root = ET.fromstring(raw)
              lines = []
              for el in root.iter():
                  t = (el.text or "").strip()
                  tag = el.get("type") or el.tag
                  if el.tag == "area" and el.get("description"):
                      lines.append("\n" + el.get("description").upper())
                  elif el.tag == "forecast-period" and el.get("start-time-local"):
                      lines.append("\n" + el.get("start-time-local")[:10])
                  if t and el.tag in ("text", "p"):
                      label = el.get("type", "").replace("_", " ").capitalize()
                      lines.append((label + ": " if label else "") + t)
              return "\n".join(lines).strip()

          for pid, name in PRODUCTS.items():
              entry = {"name": name, "text": None, "error": None}
              cands = [n for n in names if n.startswith(pid + ".")]
              cands.sort(key=lambda n: (not n.endswith(".txt"), not n.endswith(".xml"), n))
              try:
                  if not cands:
                      raise RuntimeError("no file on BOM feed")
                  buf = io.BytesIO()
                  ftp.retrbinary("RETR " + cands[0], buf.write)
                  raw = buf.getvalue()
                  entry["text"] = xml_to_text(raw) if cands[0].endswith(".xml") else raw.decode("utf-8", "replace").replace("\r\n", "\n")
                  entry["file"] = cands[0]
              except Exception as e:
                  entry["error"] = str(e)
                  print(f"{pid}: {e}")
              out["products"][pid] = entry
          ftp.quit()
          os.makedirs("data", exist_ok=True)
          with open("data/bom.json", "w") as f:
              json.dump(out, f, indent=1)
          ok = sum(1 for p in out["products"].values() if p["text"])
          print(f"Got {ok} of {len(PRODUCTS)} BOM products")
          EOF

      - name: Save if changed
        run: |
          git config user.name "bom-updater"
          git config user.email "bom-updater@users.noreply.github.com"
          git add data/bom.json
          git diff --cached --quiet || (git commit -m "Update BOM forecasts" && git push)
