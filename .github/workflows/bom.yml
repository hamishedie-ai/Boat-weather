name: Update BOM forecasts

on:
  schedule:
    - cron: "23 * * * *"   # every hour
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download BOM marine forecasts
        run: |
          python3 - <<'EOF'
          import json, os, ftplib, io, datetime, re, html, urllib.request
          import xml.etree.ElementTree as ET
          PRODUCTS = {
              "IDT12420": "Derwent Estuary",
              "IDT12430": "D'Entrecasteaux Channel",
              "IDT12450": "Frederick Henry & Norfolk Bays",
              "IDT12326": "South East Coast",
          }
          out = {"updated": datetime.datetime.now(datetime.timezone.utc).isoformat(), "products": {}}
          ftp = ftplib.FTP("ftp.bom.gov.au", timeout=60)
          ftp.login()
          ftp.cwd("/anon/gen/fwo")
          names = ftp.nlst()
          out["feed_files"] = sorted(n for n in names if n.startswith("IDT1"))
          PAGES = {"IDT12420": "derwent", "IDT12430": "channel", "IDT12450": "bays", "IDT12326": "southeastcoast"}

          def from_page(pid):
              req = urllib.request.Request(f"https://www.bom.gov.au/tas/forecasts/{PAGES[pid]}.shtml",
                  headers={"User-Agent": "Mozilla/5.0 (personal boating forecast app)"})
              page = urllib.request.urlopen(req, timeout=60).read().decode("utf-8", "replace")
              m = re.search(r'<div[^>]*id="content"[^>]*>(.*?)(?:Product IDT|<div[^>]*id="footer")', page, re.S)
              body = m.group(1) if m else page
              body = re.sub(r"<(script|style)[^>]*>.*?</\1>", "", body, flags=re.S)
              body = re.sub(r"<(br|/p|/h\d|/div|/li|/dd|/dt)[^>]*>", "\n", body)
              text = html.unescape(re.sub(r"<[^>]+>", "", body))
              text = "\n".join(l.strip() for l in text.splitlines())
              return re.sub(r"\n{3,}", "\n\n", text).strip()

          def parse_xml(raw):
              root = ET.fromstring(raw)
              res = {"warnings": [], "synoptic": None, "days": [], "text": ""}
              lines = []
              for area in root.iter("area"):
                  for el in area.iter("text"):
                      t = (el.text or "").strip(); typ = el.get("type", "")
                      if not t: continue
                      if "warning" in typ and "footer" not in typ:
                          res["warnings"].append(t)
                      elif typ == "synoptic_situation":
                          res["synoptic"] = t
                  for fp in area.findall("forecast-period"):
                      d = {"date": (fp.get("start-time-local") or "")[:10]}
                      for el in fp.iter("text"):
                          typ = el.get("type", "").replace("forecast_", "")
                          t = (el.text or "").strip()
                          if t: d[typ] = t
                      if len(d) > 1 and area.get("type") != "region":
                          d["area"] = area.get("description")
                          res["days"].append(d)
              for d in res["days"]:
                  lines.append(datetime.date.fromisoformat(d["date"]).strftime("%A %-d %B") if d["date"] else "")
                  for k in ("winds", "seas", "swell1", "swell2", "weather"):
                      if k in d: lines.append(f"{k.rstrip('12').capitalize()}: {d[k]}")
                  lines.append("")
              res["text"] = "\n".join(lines).strip()
              return res

          WARN_RE = re.compile(r"(gale|storm force|hurricane force|strong wind)[^.\n]*warning[^\n]*", re.I)
          def page_warnings(pid):
              try:
                  text = from_page(pid)
                  return sorted({m.group(0).strip() for m in WARN_RE.finditer(text) if not re.match(r"\s*no\b", m.group(0), re.I)})
              except Exception as e:
                  print(f"{pid} page: {e}")
                  return []

          for pid, name in PRODUCTS.items():
              entry = {"name": name, "text": None, "error": None}
              cands = [n for n in names if n.startswith(pid + ".") and "amoc" not in n]
              cands.sort(key=lambda n: (not n.endswith(".txt"), not n.endswith(".xml"), n))
              try:
                  if not cands:
                      entry["text"] = from_page(pid)
                      entry["file"] = "web page"
                      out["products"][pid] = entry
                      continue
                  buf = io.BytesIO()
                  ftp.retrbinary("RETR " + cands[0], buf.write)
                  raw = buf.getvalue()
                  if cands[0].endswith(".xml"):
                      entry.update(parse_xml(raw))
                  else:
                      entry["text"] = raw.decode("utf-8", "replace").replace("\r\n", "\n")
                  entry["file"] = cands[0]
              except Exception as e:
                  entry["error"] = str(e)
                  print(f"{pid}: {e}")
              entry["warnings"] = sorted(set(entry.get("warnings", []) + page_warnings(pid)))
              out["products"][pid] = entry
          ftp.quit()
          os.makedirs("data", exist_ok=True)
          with open("data/bom.json", "w") as f:
              json.dump(out, f, indent=1)
          ok = sum(1 for p in out["products"].values() if p["text"])
          print(f"Got {ok} of {len(PRODUCTS)} BOM products")
          EOF

      - name: Save if changed
        run: |
          git config user.name "bom-updater"
          git config user.email "bom-updater@users.noreply.github.com"
          git add data/bom.json
          git diff --cached --quiet || (git commit -m "Update BOM forecasts" && git push)
